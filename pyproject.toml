[project]
name = "blockchain-transaction-risk-scorer"
version = "1.0.0"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires the Docker Compose runtime",
  "failure: exercises crash, duplicate, or degraded-dependency behavior",
  "performance: opt-in benchmark that records real measurements",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  "notebooks",
  "gnn_inference.py",
  "prepare_model.py",
  "streaming",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["notebooks"]

[[tool.mypy.overrides]]
module = [
  "aiokafka.*",
  "joblib.*",
  "pandas.*",
  "prometheus_client.*",
  "redis.*",
  "sklearn.*",
  "torch_geometric.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gnn_inference"]
ignore_errors = true
