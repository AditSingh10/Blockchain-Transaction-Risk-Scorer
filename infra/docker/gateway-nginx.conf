upstream api_gateways {
    zone api_gateways 64k;
    least_conn;
    # The Compose project name is fixed to `risk-monitor`, so these DNS names
    # address both default gateway replicas directly. Resolving only the
    # service alias can return one round-robin address to open-source Nginx,
    # leaving all long-lived WebSockets pinned to that single resolved IP.
    server risk-monitor-api-gateway-1:8000;
    server risk-monitor-api-gateway-2:8000;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://api_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 10s;
    }
}
