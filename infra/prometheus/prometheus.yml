global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: replay-producer
    static_configs:
      - targets: ["replay-producer:9100"]
  - job_name: graph-materializer
    static_configs:
      - targets: ["graph-materializer:9100"]
  - job_name: outbox-relay
    static_configs:
      - targets: ["outbox-relay:9100"]
  - job_name: inference-workers
    dns_sd_configs:
      - names: ["inference-worker"]
        type: A
        port: 9100
  - job_name: result-projector
    static_configs:
      - targets: ["result-projector:9100"]
  - job_name: api-gateway
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api-gateway"]
        type: A
        port: 8000
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
