# Example keys only. Create this Secret through the production secret manager;
# do not commit live values.
apiVersion: v1
kind: Secret
metadata:
  name: risk-monitor-secrets
  namespace: risk-monitor
type: Opaque
stringData:
  RISK_POSTGRES_DSN: postgresql+asyncpg://replace:replace@managed-postgres.example:5432/risk
  RISK_REDIS_URL: rediss://:replace@managed-redis.example:6380/0
  RISK_KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  RISK_KAFKA_SASL_USERNAME: replace
  RISK_KAFKA_SASL_PASSWORD: replace
