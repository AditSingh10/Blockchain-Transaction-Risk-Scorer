apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-materializer
  namespace: risk-monitor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app: graph-materializer}
  template:
    metadata:
      labels: {app: graph-materializer}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: service
          image: ghcr.io/aditsingh10/risk-monitor-backend:1.0.0
          command: ["python", "-m", "services.graph_materializer.main"]
          envFrom:
            - configMapRef: {name: risk-monitor-config}
            - secretRef: {name: risk-monitor-secrets}
          ports: [{name: metrics, containerPort: 9100}]
          livenessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
